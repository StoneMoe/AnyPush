# Self-contained test: SMTP -> HTTP loopback
# Send email via SMTP, it gets forwarded to HTTP inbound and printed

workdir: "."

# Inbound handlers
inbound:
  # HTTP endpoint to receive and print messages
  - type: http
    name: http-printer
    host: 127.0.0.1
    port: 8080

  # SMTP endpoint to receive emails  
  - type: smtp
    name: smtp-receiver
    host: 127.0.0.1
    port: 2525

# Outbound handlers
outbound:
  # HTTP outbound that posts to our HTTP inbound
  - type: http
    name: http-loopback
    url: http://127.0.0.1:8080
    method: POST
    headers:
      Content-Type: application/json

# Routes
routes:
  # SMTP emails get logged and forwarded to HTTP
  - when:
      from: smtp-receiver
    goto:
      - action: log
        level: info
      - action: route
        to: http-loopback

  # HTTP messages get logged (printed)
  - when:
      from: http-printer
    goto:
      - action: log
        level: info
      - action: drop

inbound:
  - type: tcp
    name: tcp-in
    port: 2000
  - type: http
    name: http-in
    port: 2080
  - type: smtp
    name: smtp-in
    port: 2025
  # File watcher - watch a single file for changes
  # - type: file
  #   name: log-watcher
  #   path: /var/log/app.log
  #   mode: tail          # tail (new lines) or full (whole file)
  #   delete_after: false
  # Directory watcher - watch for new files
  # - type: directory
  #   name: uploads
  #   path: /data/incoming
  #   pattern: "*.csv"    # optional glob pattern
  #   recursive: false
  #   delete_after: true
  # FTP server - receive file uploads
  # - type: ftp
  #   name: ftp-uploads
  #   port: 2121
  #   anonymous: true

outbound:
  - type: http
    name: http-out
    url: http://localhost:8080/api
    # Templates defined here as defaults:
    # body_template: '{"file": "{{file.name}}", "data": "{{raw_base64}}"}'
    # content_type: application/json

  - type: tcp
    name: tcp-out
    host: localhost
    port: 8080
    # Template defined here as default:
    # data_template: "{{text}}"

  # - type: s3
  #   name: s3-out
  #   bucket: my-bucket
  #   key: "uploads/{{timestamp}}/{{id}}.json"
  #   body_template: "{{raw}}"
  #   content_type: text/plain

pipeline:
  # Simple route - uses outbound's default templates
  - action: route
    to: tcp-out

  # Route with override (overrides outbound config defaults):
  # - action: route
  #   to: http-out
  #   body: '{"custom": "{{text}}"}'  # overrides http-out's body_template
  #   content_type: application/json

  - action: log
    level: info

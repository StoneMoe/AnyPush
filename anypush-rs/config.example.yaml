inbound:
  - type: tcp
    name: tcp-in
    port: 2000
  - type: http
    name: http-in
    port: 2080
  - type: smtp
    name: smtp-in
    port: 2025

outbound: []

pipeline:
  - action: foreach_line
    trim: true
    skip_empty: true
    goto:
      - action: route
        
  - action: log
    level: info
